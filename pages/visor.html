<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>betaWorld - Visor de Fichas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container visor-container">
        <header class="plegable-header">
            <div class="header-barra">
                <div class="header-titulo">
                    <h1>betaWorld</h1>
                    <p>Visor de Buques</p>
                </div>
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                    <span class="barra"></span>
                    <span class="barra"></span>
                    <span class="barra"></span>
                </button>
            </div>
            <nav class="nav-principal" id="nav-menu">
                <a href="../index.html" class="nav-link">Inicio</a>
                <a href="buques.html" class="nav-link">Buques</a>
                <a href="avion.html" class="nav-link">Constructor Aviones</a>
                <a href="visor.html" class="nav-link active">Visor Buques</a>
            </nav>
        </header>

        <main>
            <!-- ÁREA DE CARGA -->
            <div id="drop-zone" class="drop-zone">
                <p>Haz clic o arrastra aquí tu archivo JSON de la ficha</p>
                <input type="file" id="file-input" accept=".json" style="display: none;">
            </div>

            <!-- CONTENEDOR DE LA FICHA (OCULTO POR DEFECTO) -->
            <div id="ficha-display" class="ficha-compacta">
                <div class="seccion">
                    <h2 id="v-nombre">-</h2>
                    <p class="inicio-descripcion">
                        <span id="v-tipo-badge">-</span> |
                        País: <span id="v-pais">-</span> |
                        Fecha: <span id="v-fecha">-</span>
                    </p>
                </div>

                <!-- ESTADÍSTICAS (IGUAL QUE EN INDEX) -->
                <div class="resumen-stats">
                    <div class="stats-grid">
                        <div class="stat-box">
                            <label>Velocidad</label>
                            <span id="v-velocidad" class="stat-value">0</span>
                        </div>
                        <div class="stat-box">
                            <label>Ataque</label>
                            <span id="v-ataque" class="stat-value">0</span>
                        </div>
                      
                        <div class="stat-box">
                            <label>Coste</label>
                            <span id="v-coste" class="stat-value">0M</span>
                        </div>
                    </div>

                    <div class="stats-grid-pl">
                        <div class="stat-box-pl">
                            <label>Daño (P/L):</label>
                            <span id="v-ataque-pl" class="stat-value-pl">-</span>
                        </div>
                        <div class="stat-box-pl">
                            <label>Defensa (P/L):</label>
                            <span id="v-defensa-pl" class="stat-value-pl">-</span>
                        </div>
                    </div>
                </div>

                <!-- MÓDULOS SELECCIONADOS -->
                <div class="seccion">
                    <h2>Módulos Instalados</h2>
                    <ul id="v-lista-modulos">
                        <!-- Se genera dinámicamente -->
                    </ul>
                </div>

                <!-- DESCRIPCIÓN -->
                <div id="v-descripcion" class="descripcion-visor">
                    <!-- Lore aquí -->
                </div>

                <div class="acciones">
                    <button onclick="location.reload()" class="btn btn-secondary">Cargar otra ficha</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/naval/visor.js"></script>
</body>
 <script>
        // Menú plegable
        const menuToggle = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');

        menuToggle.addEventListener('click', function () {
                navMenu.classList.toggle('abierto');
                menuToggle.classList.toggle('open');
            });

            navMenu.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('abierto');
                    menuToggle.classList.remove('open');
                });
            });
        </script>

        <script src="../js/naval/constructor.js"></script>
</html>
