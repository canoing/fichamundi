<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>betaWorld - Visor de Fichas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container visor-container">
        <header>
            <h1>betaWorld</h1>
            <p>Visor de Fichas (Móvil)</p>
            <nav class="nav-principal">
                <a href="index.html" class="nav-link">Constructor</a>
                <a href="visor.html" class="nav-link active">Visor</a>
            </nav>
        </header>

        <main>
            <!-- ÁREA DE CARGA -->
            <div id="drop-zone" class="drop-zone">
                <p>Haz clic o arrastra aquí tu archivo JSON de la ficha</p>
                <input type="file" id="file-input" accept=".json" style="display: none;">
            </div>

            <!-- CONTENEDOR DE LA FICHA (OCULTO POR DEFECTO) -->
            <div id="ficha-display" class="ficha-compacta">
                <div class="header-ficha">
                    <span id="v-tipo-badge" class="badge-tipo">-</span>
                    <h2 id="v-nombre">-</h2>
                    <div class="meta-info">
                        <span id="v-pais">-</span> | <span id="v-fecha">-</span>
                    </div>
                </div>

                <!-- ESTADÍSTICAS (IGUAL QUE EN INDEX) -->
                <div class="resumen-stats">
                    <div class="stats-grid">
                        <div class="stat-box">
                            <label>Velocidad</label>
                            <span id="v-velocidad" class="stat-value">0</span>
                        </div>
                        <div class="stat-box">
                            <label>Ataque</label>
                            <span id="v-ataque" class="stat-value">0</span>
                        </div>
                        <div class="stat-box">
                            <label>Defensa</label>
                            <span id="v-defensa" class="stat-value">0</span>
                        </div>
                        <div class="stat-box">
                            <label>Coste</label>
                            <span id="v-coste" class="stat-value">0M</span>
                        </div>
                    </div>

                    <div class="stats-grid-pl">
                        <div class="stat-box-pl">
                            <label>Daño (P/L):</label>
                            <span id="v-ataque-pl" class="stat-value-pl">-</span>
                        </div>
                        <div class="stat-box-pl">
                            <label>Defensa (P/L):</label>
                            <span id="v-defensa-pl" class="stat-value-pl">-</span>
                        </div>
                    </div>
                </div>

                <!-- MÓDULOS SELECCIONADOS -->
                <div class="seccion-visor">
                    <h3>Módulos Instalados</h3>
                    <ul id="v-lista-modulos" class="lista-modulos-compacta">
                        <!-- Se genera dinámicamente -->
                    </ul>
                </div>

                <!-- DESCRIPCIÓN -->
                <div id="v-descripcion" class="descripcion-visor">
                    <!-- Lore aquí -->
                </div>

                <div class="acciones">
                    <button onclick="location.reload()" class="btn btn-secondary">Cargar otra ficha</button>
                </div>
            </div>
        </main>
    </div>

    <script src="visor.js"></script>
</body>
</html>
